<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunwai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz@8..60&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Bengali&family=Noto+Sans+Tamil&family=Noto+Sans+Telugu&family=Noto+Sans+Kannada&family=Noto+Sans+Malayalam&family=Noto+Sans+Gujarati&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3EEE4; --surface: #FBF8F2; --sheet: #FFFDF8; --folder: #E8D6AE; --folder-edge: #D8C08E;
  --ink: #1B1F3B; --text: #24263A; --muted: #6F6B63; --line: #DDD4C4; --line-strong: #BFB3A0;
  --stamp: #D2452B; --stamp-soft: #F8DDD3; --indigo: #2E3C8F; --indigo-soft: #E1E5F6;
  --ok: #2E7D4F; --ok-soft: #DCEFE2; --warn: #B7791F; --warn-soft: #F6EAD2;
  --stage: #151933; --stage-ink: #F3EEE4;
  --shadow: 0 1px 0 rgba(27,31,59,.04), 0 10px 30px -12px rgba(27,31,59,.18);
  --r: 10px;
  --serif: "Fraunces", "Noto Sans Devanagari", Georgia, serif;
  --letter: "Source Serif 4", "Noto Sans Devanagari", Georgia, serif;
  --sans: "Inter", "Noto Sans Devanagari", "Noto Sans Bengali", "Noto Sans Tamil", "Noto Sans Telugu", "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Gujarati", "Nirmala UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1122; --surface: #151a30; --sheet: #1a1f38; --folder: #2a2645; --folder-edge: #3a3560;
    --ink: #F3EEE4; --text: #E6E1D6; --muted: #9C99AA; --line: #272c48; --line-strong: #3a4066;
    --stamp: #FF6A4D; --stamp-soft: #3b1d1c; --indigo: #9DAEFF; --indigo-soft: #222a52;
    --ok: #6fd39a; --ok-soft: #15301f; --warn: #f2bd5c; --warn-soft: #34290f;
    --stage: #080a17; --stage-ink: #F3EEE4;
    --shadow: 0 0 0 1px rgba(255,255,255,.03), 0 12px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1122; --surface: #151a30; --sheet: #1a1f38; --folder: #2a2645; --folder-edge: #3a3560;
  --ink: #F3EEE4; --text: #E6E1D6; --muted: #9C99AA; --line: #272c48; --line-strong: #3a4066;
  --stamp: #FF6A4D; --stamp-soft: #3b1d1c; --indigo: #9DAEFF; --indigo-soft: #222a52;
  --ok: #6fd39a; --ok-soft: #15301f; --warn: #f2bd5c; --warn-soft: #34290f;
  --stage: #080a17; --stage-ink: #F3EEE4;
  --shadow: 0 0 0 1px rgba(255,255,255,.03), 0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--sans); transition: background .3s, color .3s; }
body { background-image: radial-gradient(var(--line) .6px, transparent .6px); background-size: 18px 18px; min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
.hidden { display: none !important; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; color: var(--ink); letter-spacing: -.015em; margin: 0; }
h1 { font-size: clamp(44px, 6.4vw, 92px); line-height: .98; }
h2 { font-size: clamp(30px, 3.4vw, 44px); line-height: 1.08; }
h3 { font-size: 22px; line-height: 1.2; }
em.s { font-style: normal; color: var(--stamp); }

/* ---------- header */
.top { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.seal { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; font-family: var(--serif); font-size: 17px; position: relative; transform: rotate(-8deg); }
.seal::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1px dashed var(--stamp); opacity: .6; }
.logo b { font-family: var(--serif); font-weight: 600; font-size: 20px; letter-spacing: .01em; }
.logo span { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
nav { display: flex; gap: 4px; }
nav a { text-decoration: none; padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 14px; }
nav a:hover { color: var(--ink); background: var(--surface); }
nav a.on { color: var(--ink); background: var(--surface); box-shadow: inset 0 -2px 0 var(--stamp); }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; }
@media (max-width: 720px) { .logo span { display: none; } nav a { padding: 8px; font-size: 13px; } }
.demo { background: var(--indigo-soft); color: var(--indigo); font-size: 13px; }
.demo .wrap { display: flex; gap: 12px; justify-content: space-between; padding-top: 8px; padding-bottom: 8px; }

/* ---------- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500; cursor: pointer; text-decoration: none; transition: transform .15s, background .2s, border-color .2s; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- cards / folders */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; }
.folder { position: relative; background: var(--folder); border: 1px solid var(--folder-edge); border-radius: 4px 12px 12px 12px; padding: 28px; box-shadow: var(--shadow); margin-top: 26px; }
.folder > .tab { position: absolute; top: -27px; left: -1px; height: 28px; padding: 0 16px; display: flex; align-items: center; gap: 10px; background: var(--folder); border: 1px solid var(--folder-edge); border-bottom: 0; border-radius: 10px 10px 0 0; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); position: relative; }

/* ---------- forms */
.field { display: block; margin-bottom: 16px; }
.field span { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--ink); }
.input { width: 100%; height: 48px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--sheet); padding: 0 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
.input:focus, textarea:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 999px; padding: 4px; margin-bottom: 22px; }
.seg button { border: 0; background: none; border-radius: 999px; height: 38px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.err { color: var(--stamp); font-size: 14px; min-height: 20px; margin: 4px 0 8px; }
.or { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--muted); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--folder-edge); }

/* ---------- landing */
.hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 56px; align-items: center; padding: 64px 0 48px; }
.hero .lede { font-size: 19px; line-height: 1.5; max-width: 520px; margin: 24px 0 0; color: var(--muted); }
.def { display: inline-flex; gap: 12px; align-items: baseline; margin-top: 28px; padding: 10px 16px; border-left: 3px solid var(--stamp); background: var(--surface); border-radius: 0 8px 8px 0; }
.def b { font-family: var(--serif); font-size: 22px; color: var(--ink); font-weight: 400; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; gap: 24px; padding-top: 36px; } }
.strip { height: 120px; border-radius: 14px; overflow: hidden; background: var(--stage); margin: 8px 0 64px; position: relative; }
.strip canvas { width: 100%; height: 100%; display: block; }
.strip .cap { position: absolute; left: 20px; bottom: 14px; color: var(--stage-ink); opacity: .7; }
.how { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 80px; }
.how .card { position: relative; padding-top: 58px; }
.how .num { position: absolute; top: 18px; left: 22px; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; transform: rotate(-8deg); }
.how p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
@media (max-width: 900px) { .how { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .how { grid-template-columns: 1fr; } }

/* ---------- stepper */
.stepper { display: flex; align-items: center; gap: 10px; padding: 28px 0 8px; flex-wrap: wrap; }
.stepper .st { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 500; }
.stepper .st i { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-style: normal; font-family: var(--mono); font-size: 12px; }
.stepper .st.on { color: var(--ink); } .stepper .st.on i { border-color: var(--stamp); background: var(--stamp); color: #fff; }
.stepper .st.done { color: var(--ink); } .stepper .st.done i { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.stepper .bar { width: 44px; height: 1.5px; background: var(--line-strong); }
.stepper .fileno { margin-left: auto; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin: 18px 0 26px; flex-wrap: wrap; }
.page-head p { margin: 10px 0 0; color: var(--muted); font-size: 17px; max-width: 560px; }

/* ---------- speak stage */
.stage { position: relative; background: var(--stage); border-radius: 18px; overflow: hidden; min-height: 440px; display: grid; place-items: center; color: var(--stage-ink); box-shadow: var(--shadow); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding: 24px; }
.rec { width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer; background: var(--stamp); color: #fff; display: grid; place-items: center; position: relative; transition: transform .2s; box-shadow: 0 0 0 10px rgba(210,69,43,.18), 0 0 0 22px rgba(210,69,43,.08); }
.rec:hover { transform: scale(1.04); }
.rec svg { width: 44px; height: 44px; }
.rec.on { background: #fff; color: var(--stamp); }
.rec:disabled { cursor: wait; opacity: .7; }
.stage .say, .stage .timer { background: color-mix(in srgb, var(--stage) 78%, transparent); backdrop-filter: blur(6px); padding: 4px 14px; border-radius: 8px; }
.stage .say { font-family: var(--serif); font-size: 26px; margin-top: 14px; }
.stage .timer { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: color-mix(in srgb, var(--stage-ink) 75%, transparent); margin-top: -8px; }
.samples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 32px 0 80px; }
.sample { text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 18px; transition: transform .2s, border-color .2s; box-shadow: var(--shadow); }
.sample:hover { transform: translateY(-2px); border-color: var(--stamp); }
.sample .script { font-size: 28px; color: var(--ink); line-height: 1.3; }
.sample .t { font-weight: 500; margin-top: 6px; color: var(--ink); }
.sample .p { color: var(--muted); font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 760px) { .samples { grid-template-columns: 1fr; } }

/* ---------- check */
.narrow { max-width: 820px; margin: 0 auto; }
.lined { width: 100%; min-height: 280px; border: 0; outline: none; resize: vertical; background: transparent; padding: 22px 28px 22px 64px; font-size: 21px; line-height: 40px; color: var(--ink);
  background-image: linear-gradient(90deg, transparent 47px, var(--stamp-soft) 47px, var(--stamp-soft) 49px, transparent 49px), repeating-linear-gradient(transparent 0 39px, var(--line) 39px 40px);
  background-attachment: local; background-position: 0 22px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--indigo-soft); color: var(--indigo); font-size: 13px; font-weight: 600; }
.translation { margin-top: 20px; padding: 16px 20px; border-radius: var(--r); background: var(--surface); border: 1px dashed var(--line-strong); }
.translation p { margin: 6px 0 0; font-size: 16px; }

/* ---------- drafting */
.typing { padding: 48px clamp(24px, 6vw, 72px); min-height: 460px; }
.typing .ln { height: 12px; border-radius: 6px; background: var(--line); margin: 16px 0; transform-origin: left; animation: type 1.6s ease-in-out infinite; }
@keyframes type { 0% { transform: scaleX(0); opacity: .4 } 60% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: .4 } }
.stages { margin-top: 28px; }
.stages div { display: flex; gap: 12px; align-items: center; padding: 6px 0; color: var(--muted); }
.stages div::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
.stages .on { color: var(--ink); font-weight: 500; } .stages .on::before { border-color: var(--stamp); background: var(--stamp); animation: blink 1s infinite; }
.stages .done { color: var(--ok); } .stages .done::before { border-color: var(--ok); background: var(--ok); }
@keyframes blink { 50% { opacity: .3 } }

/* ---------- draft */
.draft { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: start; margin-bottom: 80px; }
@media (max-width: 960px) { .draft { grid-template-columns: 1fr; } }
.letter-sheet { padding: clamp(24px, 5vw, 56px); }
.letter-sheet .hdr { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
.letter-sheet .subj { font-family: var(--letter); font-size: 18px; margin: 0 0 16px; color: var(--ink); }
.letter-sheet textarea { width: 100%; min-height: 460px; border: 0; background: transparent; resize: vertical; outline: none; font-family: var(--letter); font-size: 17px; line-height: 1.75; color: var(--text); padding: 0; }
.letter-sheet textarea:focus { box-shadow: none; }
.wc { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; margin-top: 10px; }
.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 84px; }
@media (max-width: 960px) { .side { position: static; } }
.meta { display: grid; gap: 12px; }
.meta div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; font-size: 14px; }
.meta small { color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.urg { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border: 1.5px solid currentColor; border-radius: 4px; transform: rotate(-3deg); display: inline-block; }
.urg.High { color: var(--stamp); } .urg.Medium { color: var(--warn); } .urg.Low { color: var(--ok); }
.hear { background: var(--stage); color: var(--stage-ink); border: 0; }
.hear .row { flex-wrap: nowrap; }
.play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--stamp); color: #fff; cursor: pointer; display: grid; place-items: center; flex: none; }
.play svg { width: 18px; height: 18px; }
.hear p { margin: 14px 0 0; font-size: 16px; line-height: 1.6; opacity: .92; }
.hear canvas { height: 40px; flex: 1; min-width: 0; }
.evi { list-style: none; margin: 0; padding: 0; }
.evi li { padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.evi li:first-child { border-top: 0; padding-top: 4px; }
.evi mark { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--warn) 35%, transparent) 55%); color: var(--ink); padding: 0 2px; }
.evi .ok mark { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--ok) 30%, transparent) 55%); }
.evi .q { margin-top: 6px; font-size: 15px; }
.evi .b { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; }
.evi .ok .b { color: var(--ok); } .evi .no .b { color: var(--warn); }
.qitem { padding: 14px 0; border-top: 1px solid var(--line); }
.qitem:first-of-type { border-top: 0; padding-top: 0; }
.qitem .qn { color: var(--ink); font-weight: 500; }
.qitem .qe { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.qitem .row { flex-wrap: nowrap; }
.qitem .input { height: 42px; }
.mic { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--sheet); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.mic svg { width: 16px; height: 16px; }
.mic.on { background: var(--stamp); border-color: var(--stamp); color: #fff; animation: blink 1s infinite; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

/* stamp */
.stampmark { position: absolute; bottom: 48px; right: 7%; border: 4px double var(--stamp); color: var(--stamp); font-family: var(--mono); font-weight: 500; font-size: 30px; letter-spacing: .18em; padding: 10px 22px; border-radius: 8px; transform: rotate(-14deg) scale(2.4); opacity: 0; pointer-events: none; mix-blend-mode: multiply; }
:root[data-theme="dark"] .stampmark { mix-blend-mode: normal; }
.stampmark.go { animation: stamp .45s cubic-bezier(.2,.9,.3,1.3) forwards; }
@keyframes stamp { to { transform: rotate(-14deg) scale(1); opacity: .9; } }

/* ---------- list */
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px 20px; margin: 10px 0 80px; }
.files .folder { cursor: pointer; transition: transform .2s; padding: 22px; min-height: 170px; display: flex; flex-direction: column; }
.files .folder:hover { transform: translateY(-3px) rotate(-.3deg); }
.files h3 { font-size: 20px; margin: 4px 0 8px; }
.files .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.status { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 4px; border: 1.5px solid currentColor; transform: rotate(-3deg); }
.status.Drafted { color: var(--muted); } .status.Submitted { color: var(--indigo); } .status.Under { color: var(--warn); } .status.Resolved { color: var(--ok); } .status.Closed { color: var(--muted); }
.empty { text-align: center; padding: 60px 20px; }
.empty p { color: var(--muted); }

/* ---------- detail */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 28px; align-items: start; margin-bottom: 80px; }
@media (max-width: 960px) { .detail { grid-template-columns: 1fr; } }
.tl { list-style: none; padding: 0; margin: 0; }
.tl li { position: relative; padding: 0 0 20px 28px; }
.tl li::before { content: ""; position: absolute; left: 5px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--stamp); box-shadow: 0 0 0 4px var(--stamp-soft); }
.tl li::after { content: ""; position: absolute; left: 9.5px; top: 20px; bottom: 0; width: 1.5px; background: var(--line-strong); }
.tl li:last-child::after { display: none; }
.tl .when { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; opacity: 0; transition: .3s; pointer-events: none; z-index: 60; font-size: 14px; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.fade { animation: fade .45s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px) } }

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800); }

// ---------------------------------------------------------------- voiceprint canvas
// A row of rounded bars that breathes when idle and follows the mic level when live.
let waves = [];
function voiceprint(canvas, { bars = 72, getLevel = () => 0, color = "#F3EEE4", accent = "#FF6A4D", idle = .12 } = {}) {
  const ctx = canvas.getContext("2d"); let raf, smooth = 0; const seed = [...Array(bars)].map(() => Math.random());
  function frame(t) {
    const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    smooth += (getLevel() - smooth) * .25;
    const gap = w / bars, bw = Math.max(2, gap * .45), live = smooth > .02;
    for (let i = 0; i < bars; i++) {
      const x = i * gap + gap / 2, d = Math.abs(i - bars / 2) / (bars / 2);
      const breath = (Math.sin(t / 900 + i * .35) + 1) / 2;
      const amp = idle * (.35 + breath * .65) + smooth * (1 - d * .7) * (.55 + seed[i] * .45) * (.7 + .3 * Math.sin(t / 90 + i));
      const bh = Math.max(3, amp * h * .9);
      ctx.globalAlpha = live ? .35 + (1 - d) * .65 : .22 + (1 - d) * .25;
      ctx.fillStyle = live && d < .35 ? accent : color;
      ctx.beginPath(); ctx.roundRect(x - bw / 2, h / 2 - bh / 2, bw, bh, bw / 2); ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = () => cancelAnimationFrame(raf); waves.push(stop); return stop;
}

// ---------------------------------------------------------------- audio capture (16 kHz mono WAV)
class Recorder {
  constructor(onLevel) { this.onLevel = onLevel; }
  async start() {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    this.ctx = new AudioContext();
    const src = this.ctx.createMediaStreamSource(this.stream);
    this.node = this.ctx.createScriptProcessor(4096, 1, 1); this.buffers = [];
    this.node.onaudioprocess = e => {
      const d = e.inputBuffer.getChannelData(0); this.buffers.push(new Float32Array(d));
      let s = 0; for (let i = 0; i < d.length; i += 16) s += d[i] * d[i];
      this.onLevel?.(Math.min(1, Math.sqrt(s / (d.length / 16)) * 7));
    };
    src.connect(this.node); this.node.connect(this.ctx.destination);
  }
  async stop() {
    this.node.disconnect(); this.stream.getTracks().forEach(t => t.stop());
    const rate = this.ctx.sampleRate; await this.ctx.close();
    const all = new Float32Array(this.buffers.reduce((n, b) => n + b.length, 0)); let o = 0;
    for (const b of this.buffers) { all.set(b, o); o += b.length; }
    return encodeWav(downsample(all, rate, 16000), 16000);
  }
}
function downsample(buf, from, to) {
  if (from === to) return buf;
  const ratio = from / to, out = new Float32Array(Math.floor(buf.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const s = Math.floor(i * ratio), e = Math.min(buf.length, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = s; j < e; j++) sum += buf[j]; out[i] = sum / Math.max(1, e - s);
  }
  return out;
}
function encodeWav(x, rate) {
  const b = new ArrayBuffer(44 + x.length * 2), v = new DataView(b);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + x.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, x.length * 2, true);
  for (let i = 0; i < x.length; i++) { const s = Math.max(-1, Math.min(1, x[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([b], { type: "audio/wav" });
}
function transcribe(blob) { const fd = new FormData(); fd.append("file", blob, "speech.wav"); return api("/api/transcribe", { method: "POST", body: fd }); }

let rec = null, timer = null;
function viewSpeak() {
  app.innerHTML = `${stepper(0)}
  <div class="page-head fade"><div><h2>What happened?</h2><p>Speak the way you'd explain it to a neighbour: what's wrong, where, since when, and who you've already told.</p></div></div>
  <section class="stage fade" id="stage">
    <canvas id="wave"></canvas>
    <div class="center">
      <button class="rec" id="recBtn" aria-label="Start recording">${ICON.mic}</button>
      <div class="say" id="say">Tap to start speaking</div>
      <div class="timer" id="timer">Any Indian language · up to 2:00</div>
    </div>
  </section>
  <div class="label" style="margin-top:36px">No mic? Open a sample complaint</div>
  <section class="samples" style="margin-top:0">${SAMPLES.map((s, i) => `

  voiceprint($("#wave"), { bars: 90, getLevel: () => S.level, accent: "#FF6A4D" });
  $$(".sample").forEach(b => b.onclick = () => { const s = SAMPLES[b.dataset.i]; Object.assign(S, { native: s.text, english: "", lang: s.lang, draft: null }); go("#/check"); });

    if (rec) return finish();
    try { rec = new Recorder(l => S.level = l); await rec.start(); }
    catch { rec = null; return toast("Microphone unavailable. Allow mic access or open a sample."); }
    const t0 = Date.now();
    $("#recBtn").classList.add("on"); $("#recBtn").innerHTML = ICON.stop; $("#say").textContent = "Listening… tap to finish";
    timer = setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      $("#timer").textContent = `● REC ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} / 2:00`;
      if (s >= 120) finish();
    }, 250);
  };
  async function finish() {
    clearInterval(timer); const r = rec; rec = null; S.level = 0;
    $("#recBtn").disabled = true; $("#recBtn").classList.remove("on"); $("#recBtn").innerHTML = ICON.mic;
    $("#say").textContent = "Transcribing with Saaras…"; $("#timer").textContent = "Detecting your language";

  }
}

async function runDraft(answers) {
  if (!S.native.trim()) return toast("Your complaint is empty.");
  stopWaves();
  const stages = ["Reading your complaint", "Writing a formal grievance with Sarvam-105B", "Matching every fact to your words"];
  app.innerHTML = `${stepper(2)}<div class="narrow fade"><div class="page-head"><div><h2>Drafting your grievance…</h2><p>This takes about ten seconds.</p></div></div>
    <div class="sheet typing">${[92, 78, 88, 64, 95, 70, 84, 40].map((w, i) => `<div class="ln" style="width:${w}%;animation-delay:${i * .18}s"></div>`).join("")}
    <div class="stages" id="stg"></div></div></div>`;
  const paint = n => $("#stg") && ($("#stg").innerHTML = stages.map((s, i) => `<div class="${i < n ? "done" : i === n ? "on" : ""}">${s}</div>`).join(""));
  paint(0);
  const t1 = setTimeout(() => paint(1), 900), t2 = setTimeout(() => paint(2), 6000);
  try {
    S.draft = await send("/api/draft", { native: S.native, english: S.english, language_code: S.lang, answers });
    S.audio = null;
    if (location.hash === "#/draft") viewDraft(); else go("#/draft");
  } catch (e) { toast(e.message); if (S.draft) viewDraft(); else viewCheck(); }
  finally { clearTimeout(t1); clearTimeout(t2); }
}

      <div class="card">
        <div class="label">Make it stronger · optional</div>
        <div id="qs">${d.missing_info.map(q => `<div class="qitem"><div class="qn">${esc(q.question_native || q.question_en)}</div>${q.question_native && q.question_en ? `<div class="qe">${esc(q.question_en)}</div>` : ""}
          <div class="row"><input class="input" data-q="${esc(q.question_en || q.question_native)}" placeholder="Type or speak"><button class="mic" aria-label="Answer by voice">${ICON.mic}</button></div></div>`).join("")}</div>
        <button class="btn ink wide" id="redraft" style="margin-top:14px">Update the draft</button>
      </div>` : ""}
      <div class="card">
        <button class="btn primary wide" id="save">Save to my files</button>
        <div class="row" style="margin-top:10px"><button class="btn" id="copy" style="flex:1">Copy</button><a class="btn" style="flex:1" href="https://pgportal.gov.in" target="_blank" rel="noopener">CPGRAMS ↗</a></div>
      </div>
    </aside>
  </section>`;
  const wc = () => { const v = $("#letter").value; $("#wc").textContent = `${v.trim().split(/\s+/).filter(Boolean).length} words · ${v.length} chars`; };
  $("#letter").oninput = () => { d.grievance_text = $("#letter").value; wc(); }; wc();
  let playing = 0;
  voiceprint($("#hearWave"), { bars: 36, idle: .15, getLevel: () => playing, accent: "#FF6A4D" });
  $("#play").onclick = async () => {
    const b = $("#play");
    if (S.audio && !S.audio.paused) { S.audio.pause(); playing = 0; b.innerHTML = ICON.play; return; }
    if (!S.audio) {
      b.disabled = true;
      try { const { audio } = await send("/api/tts", { text: d.summary_native, language_code: S.lang }); S.audio = new Audio("data:audio/wav;base64," + audio); }
      catch (e) { toast(e.message); return; } finally { b.disabled = false; }
    }
    S.audio.onended = () => { playing = 0; if ($("#play")) $("#play").innerHTML = ICON.play; };
    S.audio.play(); playing = .7; b.innerHTML = ICON.pause;
  };
  $("#copy").onclick = async () => { await navigator.clipboard.writeText(`Subject: ${d.title}\n\n${d.grievance_text}\n\nRelief sought: ${d.relief_sought}`); toast("Copied. Paste it into CPGRAMS."); };
  $("#save").onclick = async () => {
    try {
      const g = await send("/api/grievances", { transcript: S.native, language_code: S.lang, draft: d });
      $("#stampmark").classList.add("go"); toast(`Filed as ${g.id}`);
      setTimeout(() => go(`#/g/${g.id}`), 1100);
    } catch (e) { toast(e.message); }
  };
  let qrec = null;
  $$(".mic").forEach(btn => btn.onclick = async () => {
    const input = btn.previousElementSibling;
    if (qrec?.btn === btn) {
      const r = qrec.rec; qrec = null; btn.classList.remove("on"); btn.innerHTML = ICON.mic; input.placeholder = "Transcribing…";
      try { input.value = (await transcribe(await r.stop())).native; } catch (e) { toast(e.message); }
      input.placeholder = "Type or speak"; return;
    }
    if (qrec) return toast("Finish the current answer first.");
    try { const r = new Recorder(); await r.start(); qrec = { rec: r, btn }; btn.classList.add("on"); btn.innerHTML = ICON.stop; input.placeholder = "Listening…"; }
    catch { toast("Microphone unavailable. Type instead."); }
  });
  $("#redraft") && ($("#redraft").onclick = () => {
    const answers = $$("#qs input").filter(i => i.value.trim()).map(i => ({ question: i.dataset.q, answer: i.value.trim() }));
    if (!answers.length) return toast("Answer at least one question first.");
    runDraft(answers);
  });
}

async function viewList() {
  S.items = await api("/api/grievances");
  app.innerHTML = `
  <div class="page-head fade" style="margin-top:36px"><div><h2>My files.</h2><p>${S.items.length ? `${S.items.length} grievance${S.items.length > 1 ? "s" : ""} on record. Open one to add its CPGRAMS number or update its status.` : ""}</p></div><a class="btn primary" href="#/speak">+ New complaint</a></div>
  ${S.items.length ? `<section class="files fade">${S.items.map(g => `
    <div class="folder" data-id="${esc(g.id)}"><div class="tab">${esc(g.id)}</div>
      <div class="mono muted">${esc(g.draft.category)}</div>
      <h3>${esc(g.draft.title)}</h3>
      <div class="foot"><span class="mono muted">${new Date(g.created_at).toLocaleDateString("en-IN", { day: "2-digit", month: "short" })}${g.reg_no ? " · " + esc(g.reg_no) : ""}</span><span class="status ${esc(g.status.split(" ")[0])}">${esc(g.status)}</span></div>
    </div>`).join("")}</section>`
    : `<div class="card empty fade"><h3>No files yet</h3><p>Grievances you save will show up here, so you can follow each one until it's resolved.</p><a class="btn primary" href="#/speak">Start a complaint</a></div>`}`;
  $$("[data-id]").forEach(r => r.onclick = () => go(`#/g/${r.dataset.id}`));
}

async function viewDetail(id) {
  if (!S.items.find(x => x.id === id)) S.items = await api("/api/grievances");
  const g = S.items.find(x => x.id === id); if (!g) return go("#/grievances");
  app.innerHTML = `
  <div class="page-head fade" style="margin-top:36px"><div><a class="btn ghost" href="#/grievances" style="padding:0;min-height:0;margin-bottom:12px">← My files</a>
    <div class="tags"><span class="tag">${esc(g.id)}</span><span class="tag">${esc(g.draft.category)}</span><span class="status ${esc(g.status.split(" ")[0])}">${esc(g.status)}</span></div><h2>${esc(g.draft.title)}</h2></div></div>
  <section class="detail fade">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="folder" style="margin-top:28px"><div class="tab">Update file</div>
        <label class="field"><span>Status</span><select class="input" id="st">${STATUSES.map(s => `<option ${s === g.status ? "selected" : ""}>${s}</option>`).join("")}</select></label>
        <label class="field"><span>CPGRAMS registration no.</span><input class="input" id="reg" value="${esc(g.reg_no)}" placeholder="DARPG/E/2026/0012345"></label>
        <button class="btn ink wide" id="upd">Save update</button>
        <a class="btn wide" style="margin-top:10px" href="https://pgportal.gov.in" target="_blank" rel="noopener">Check status on CPGRAMS ↗</a>
      </div>
      <div class="card"><div class="label">Timeline</div><ul class="tl">${g.history.slice().reverse().map(h => `<li><div style="color:var(--ink);font-weight:500">${esc(h.status)}</div>${h.note ? `<div class="muted" style="font-size:14px">${esc(h.note)}</div>` : ""}<div class="when">${new Date(h.at).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })}</div></li>`).join("")}</ul></div>
      <button class="btn ghost" id="del" style="align-self:flex-start">Delete this file</button>
    </div>
    <div>
      <div class="sheet letter-sheet">
        <div class="hdr"><span class="mono muted">${esc(g.id)}</span><span class="mono muted">${new Date(g.created_at).toLocaleDateString("en-IN", { day: "2-digit", month: "long", year: "numeric" })}</span></div>
        <p class="subj"><b>Subject:</b> ${esc(g.draft.title)}</p>
        <div style="white-space:pre-wrap;font-family:var(--letter);font-size:17px;line-height:1.75">${esc(g.draft.grievance_text)}</div>
        <div class="stampmark go" style="animation:none;opacity:.85;transform:rotate(-14deg)">${g.status === "Resolved" ? "RESOLVED" : "FILED"}</div>
      </div>
      <div class="card" style="margin-top:16px"><div class="label">In your words · ${esc(langName(g.language_code))}</div><div style="font-size:17px;line-height:1.6;color:var(--ink)">${esc(g.transcript)}</div></div>
    </div>
  </section>`;
  $("#upd").onclick = async () => {
    const patch = {}, st = $("#st").value, reg = $("#reg").value.trim();
    if (st !== g.status) patch.status = st; if (reg !== g.reg_no) patch.reg_no = reg;
    if (!Object.keys(patch).length) return toast("Nothing changed.");
    try { const u = await send(`/api/grievances/${encodeURIComponent(id)}`, patch, "PATCH"); S.items = S.items.map(x => x.id === id ? u : x); toast("File updated"); viewDetail(id); }
    catch (e) { toast(e.message); }
  };
  $("#del").onclick = async () => {
    if (!confirm(`Delete ${id}? This can't be undone.`)) return;
    await api(`/api/grievances/${encodeURIComponent(id)}`, { method: "DELETE" }); S.items = []; go("#/grievances");
  };
}

// ---------------------------------------------------------------- router
function stopWaves() { waves.forEach(s => s()); waves = []; }
async function route() {
  const h = location.hash || "#/";
  if (h === "#/logout") { await send("/api/logout").catch(() => {}); S.user = null; return go("#/"); }
  if (rec) { try { await rec.stop(); } catch {} rec = null; clearInterval(timer); }
  S.audio?.pause(); stopWaves();
  $("#nav").classList.toggle("hidden", !S.user);
  $("#demo").classList.toggle("hidden", !S.user?.demo);
  const key = h.split("/")[1] || "";
  $$("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === key || (a.dataset.r === "speak" && ["check", "draft"].includes(key)) || (a.dataset.r === "grievances" && key === "g")));
  window.scrollTo(0, 0);
  if (!S.user) return viewLanding();
  if (key === "" || key === "speak") return key ? viewSpeak() : go("#/speak");
  if (key === "check") return viewCheck();
  if (key === "draft") return viewDraft();
  if (key === "grievances") return viewList().catch(e => toast(e.message));
  if (key === "g") return viewDetail(decodeURIComponent(h.split("/")[2] || "")).catch(e => toast(e.message));
  go("#/speak");
}
async function boot(next) {
  try { S.user = await api("/api/me"); } catch { S.user = null; }
  if (next && location.hash !== next) location.hash = next; else route();
}
window.addEventListener("hashchange", route);
boot();
</script>
